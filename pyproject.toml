[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsprec"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
verify = ["z3-solver>=4.13"]
text = ["transformers>=4.51"]
report = ["reportlab>=4.0", "pypdf>=4.0", "matplotlib>=3.9"]
descriptions = ["pyarrow>=10"]

[project.scripts]
wsprec = "wsprec.cli:main"

[tool.setuptools.packages.find]
include = ["wsprec*"]
